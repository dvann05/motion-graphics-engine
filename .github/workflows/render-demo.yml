name: Render Motion Graphics Demo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Render Demo Video (Python + FFmpeg)
        run: |
          python examples/render_quick_demo.py
          ls -lh output/

      - name: Upload Rendered MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-graphics-sample
          path: output/*.mp4
          retention-days: 14
